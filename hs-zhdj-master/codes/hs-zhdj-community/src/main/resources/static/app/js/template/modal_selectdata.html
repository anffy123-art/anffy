<div class="modal" tabindex="-1" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" ng-click="$hide()">&times;</button>
                <h4 class="modal-title">{{title}}</h4>
            </div>
            <div class="modal-body">
                <div class="panel-body">
                    <div class="row">
                        <div class="panel" style="padding-bottom: 0;">
                            <form>
                                <div class="input-group">
                                    <input type="text" class="form-control" ng-model="data.findkey" placeholder="查询">
                                    <span class="input-group-btn">
                                        <button class="btn btn-default" ng-click="loadData()"><i
                                                class="glyphicon glyphicon-zoom-in"></i></button>
                                    </span>
                                </div><!-- /input-group -->
                            </form>

                        </div>
                    </div>
                    <div class="row">
                        <div class="panel panel-default">
                            <div class="panel-heading">查询列表</div>
                            <div class="panel-body">
                                <div ng-if="!isMulti">
                                    <div class="radio" ng-repeat="it in data.items">
                                        <label>
                                            <input type="radio" name="optionsRadios" ng-value="it"
                                                   ng-model="data.radioit">
                                            {{it.label}}
                                        </label>
                                    </div>
                                </div>
                                <div ng-if="isMulti">
                                    <div class="radio" ng-repeat="it in data.items">
                                        <label>
                                            <input type="checkbox" name="optionsRadios" ng-value="it"
                                                   ng-model="it.checked" ng-click="selectOne(it)">
                                            {{it.label}}
                                        </label>
                                    </div>
                                </div>
                                <div ng-show="data.items.length==0">
                                    <p>暂无选项</p>
                                </div>
                            </div>
                            <pagination data-pageindex="finddata.pageindex" data-pagesize="finddata.pagesize"
                                        data-ptotal="finddata.ptotal"></pagination>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" ng-click="$hide()">取消</button>
                <button type="button" class="btn btn-primary" ng-click="selectedData()">选择</button>
            </div>
        </div>
    </div>
</div>
