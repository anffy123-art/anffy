<div class="card pt-header">
    <div class="header" style="cursor: pointer;min-height: 35px;padding-top: 7px;">
        <div class="pt-body" ng-click="reset()"
             ng-class="selectdzzdm == gddwdm ?'party_active':''">
            全校党组织
        </div>
    </div>
    <div class="body treebody2">
        <div class="menu" ng-style="{'height':height!=null?height+'px':'calc(100vh - 150px)'}">
            <script type="text/ng-template" id="nodes.html">
                <li>
                    <div class="treerow" ng-class="isActive(data)" ng-click="clickNode(data)" >
                        <i ng-if="data.childList.length>0" class="material-icons">{{data.show==1 ?
                            'expand_more' :
                            'chevron_right'}}</i>
                        <span class="icon-name" ng-class="data.childList.length>0?'':'icon-name-spac'">{{data.name}}</span>
                    </div>
                    <div ng-hide="data.show != 1">
                        <div class="treeitem"
                             ng-repeat="data in data.childList" ng-include="'nodes.html'"></div>
                    </div>
                </li>
            </script>
            <ul class="pt-body" ng-repeat="data in dataList"
                ng-include="'nodes.html'">
            </ul>
        </div>
    </div>
</div>
