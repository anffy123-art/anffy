<style>
    .partytree .card {
        box-shadow: none;
        margin-bottom: 0px;
    }

    .partytree .card .header {
        padding: 15px 20px;
    }
</style>
<div id="userselect1" class="modal" tabindex="-1" role="dialog">
    <div class="modal-dialog" style="width:75%;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" ng-click="$hide()">&times;</button>
                <h4 class="modal-title">{{title}}</h4>
            </div>
            <div class="modal-body">
                <div class="row" style="height: 50px; line-height: 50px;">
                    <div class="col-md-3 col-md-offset-5" style="padding: 0px;">
                        <!--查询框-->
                        <form ng-submit="searchUser()">
                            <div class="input-group">
                                <input ng-model="searchParam" class="form-control" type="text" placeholder="输入成员姓名进行查询">
                                <span class="input-group-addon ng-isolate-scope" style="cursor: pointer;"
                                      ng-click="searchUser()"><i class="glyphicon glyphicon-search"></i></span>
                            </div>
                        </form>
                    </div>
                </div>
                <!--<div class="panel panel-custom">-->
                <div class="row row_border" style="padding-bottom: 0px;">
                    <div class="col-md-5" style="padding-right: 0px;">
                        <div class="panel panel-default">
                            <div class="panel-heading">组织机构列表</div>
                            <div class="panel-body" style="padding: 0px;">
                                <div class="partytree" party-tree data-selectdzzdm="selectdzzdm"
                                     data-selectdzzmc="selectdzzmc"
                                     data-height="40" data-isshowxz="0" data-showtogglebtn="false"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3" style="padding-left: 0px; padding-right: 0px;">
                        <div class="panel panel-default" id="UserListContent">
                            <div class="panel-heading">组织名称人员<img style="height:18px" ng-show="isloading"
                                                                  src="../../scripts/loading-2.gif"/></div>
                            <div class="panel-body" style="padding: 0px;overflow-y: auto;height:48vh">
                                <select class="form-control"
                                        style="padding: 5px 0px 5px 10px; font-size: 14px;height:inherit"
                                        multiple="multiple" ng-model="tempAdd"
                                        ng-options="user.name+'('+user.id+')' for user in userSelectList"
                                        ng-dblclick="addUser(user)"></select>
                            </div>

                        </div>
                    </div>
                    <div class="col-md-1">
                        <div class="maddleButton">
                            <div class="midbtn">
                                <button type="button" class="btn btn-success midbtn" ng-click="addUser()">添加</button>
                            </div>
                            <div class="midbtn">
                                <button type="button" class="btn btn-danger midbtn" ng-click="deleteUser()">删除</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 clear_end" style="padding-right: 30px">
                        <div class="panel panel-default">
                            <div class="panel-heading">已选择人员</div>
                            <div class="panel-body" style="overflow: auto; padding: 0px;">
                                <select class="form-control pageContent_end"
                                        style="padding: 5px 0px 5px 10px; font-size: 14px;overflow-y: auto;height:48vh !important"
                                        size="200" multiple="multiple" ng-model="tempSelected"
                                        ng-options="user.name+'('+user.id+')' for user in rightusers"
                                        ng-dblclick="deleteUser(user)"></select>
                            </div>
                        </div>
                    </div>
                </div>
                <!--</div>-->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" ng-click="$hide()">取消</button>
                <button type="button" class="btn btn-primary" ng-click="selectedData()">选择</button>
            </div>

        </div>
    </div>
</div>
