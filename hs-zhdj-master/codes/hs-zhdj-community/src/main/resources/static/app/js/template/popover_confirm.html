<div class="popover" tabindex="-1">
    <div class="arrow"></div>
    <h3 class="popover-title" ng-bind-html="title"></h3>
    <div class="popover-content">
        <p ng-bind-html="content" style="min-width:300px;"></p>
        <div class="form-actions">
            <button type="button" class="btn btn-danger" ng-click="$hide()">取消</button>
            <button type="button" class="btn btn-primary" ng-click=";$hide()">确定</button>
        </div>

    </div>
</div>
