<titlemenu></titlemenu>
<div class="dj-card">
    <div class="dj-body" activate-input activate-select>
        <div ng-include="'../main/asset/show.html'" onload="loadAsset()" ng-controller="assetShowCtrl"></div>
        <div panel-title data-title="'资产处置信息'"></div>
        <div class="dj-formtable">
            <table class="dj-table dj-table3">
                <tr>
                    <th>处置时间</th>
                    <td>
                        {{dataModel.disposaltime | date:'yyyy-MM-dd'}}
                    </td>
                    <th>处置人员</th>
                    <td>
                        {{dataModel.username}}
                    </td>
                    <th>处置类型</th>
                    <td>
                        {{dataModel.disposaltypename}}
                    </td>
                </tr>
                <tr>
                    <th>备注</th>
                    <td colspan="5">
                        {{dataModel.remark}}
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>
