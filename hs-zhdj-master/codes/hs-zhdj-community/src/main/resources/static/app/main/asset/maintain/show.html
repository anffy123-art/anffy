<titlemenu></titlemenu>
<div class="dj-card">
    <div class="dj-body" activate-input activate-select>
        <div ng-include="'../main/asset/show.html'" onload="loadAsset()" ng-controller="assetShowCtrl"></div>
        <div panel-title data-title="'资产维修信息'"></div>
        <div class="dj-formtable">
            <table class="dj-table dj-table3">
                <tr>
                    <th>维修时间</th>
                    <td>
                        {{dataModel.maintaintime | date:'yyyy-MM-dd'}}
                    </td>
                    <th>维修申请人员</th>
                    <td>
                        {{dataModel.applyusername}}
                    </td>
                    <th>维修费用</th>
                    <td>
                        {{dataModel.money}}
                    </td>
                </tr>
                <tr>
                    <th>备注</th>
                    <td colspan="5">
                        {{dataModel.remark}}
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>
