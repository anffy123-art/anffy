<titlemenu></titlemenu>
<div class="dj-card">
    <div class="dj-body" activate-input activate-select>
        <form role="form" name="editForm" novalidate>
            <div class="dj-formtable">
                <table class="dj-table">
                    <tr>
                        <th>计划名称</th>
                        <td colspan="3">
                            {{changevm.name}}
                        </td>
                    </tr>
                    <tr>
                        <th>发送单位</th>
                        <td colspan="3">
                            {{changevm.sendDepartmentName}}
                        </td>
                    </tr>
                    <tr>
                        <th>要求</th>
                        <td colspan="3">
                            {{changevm.requirement}}
                        </td>
                    </tr>
                    <tr>
                        <th>学习计划类型</th>
                        <td>
                            {{changevm.typeName}}
                        </td>
                        <th>完成日期</th>
                        <td>
                            {{changevm.endTime}}
                        </td>
                    </tr>
                    <tr>
                        <th>计划内容</th>
                        <td colspan="3">
                            <span ng-bind-html="changevm.content"></span>
                        </td>
                    </tr>
                </table>
            </div>
            <bsfiles ng-model="reqFileModel"/>

            <div class="form_foot">
                <button type="button" class="btn btn-default" ng-click="pagechange();">返回</button>
            </div>
        </form>
    </div>
</div>
