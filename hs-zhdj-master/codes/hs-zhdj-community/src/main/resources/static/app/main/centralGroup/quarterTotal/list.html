<titlemenu></titlemenu>
<div class="dj-list">
    <div class="dj-list-body">
        <div party-tree data-selectdzzdm="treeparams.selectdzzdm" data-selectdzzmc="treeparams.selectdzzmc"
             data-defaultselected="treeparams.defaultselected" data-isunfold="treeparams.isunfold" data-onlyshowdw="treeparams.onlyshow_dw"></div>
        <div class="dj-list-content">
            <div class="card">
                <div activate-input activate-select class="header search-header">
                    <div fold-partytree data-isunfold="treeparams.isunfold"></div>
                    <div class="search-param-panel">
                        <div class="search-input">
                            <form class="form-horizontal">
                                <div class="row clearfix form-inline">
                                    <div class="col-lg-2 col-md-2 dj-label">
                                        <label>当前选中组织</label>
                                    </div>
                                    <div class="col-lg-2 col-md-2">
                                        <div class="form-group">
                                            <div class="form-line">
                                                <div class="input-group input-group-search">
                                                    <input name="selectdzzmc" type="text" style="min-width: 90px"
                                                           ng-model="treeparams.selectdzzmc" class="form-control"
                                                           ng-disabled="true"/>
                                                    <span class="input-group-addon"
                                                          ng-click="setisunfold()">选择</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-2 col-md-2 dj-label">
                                        <label>年度</label>
                                    </div>
                                    <div class="col-lg-2 col-md-2">
                                        <div class="form-group">
                                            <div class="form-line">
                                                <select class="form-control show-tick" ng-model="selectparams.year" ng-change="search()"
                                                        ng-options="type.dickey as type.dicvalue for type in yearList"
                                                        class="form-control"
                                                        name="year">
                                                    <option value="" selected>--全部--</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-2 col-md-2 dj-label">
                                        <label>季度</label>
                                    </div>
                                    <div class="col-lg-2 col-md-2">
                                        <div class="form-group">
                                            <div class="form-line">
                                                <select class="form-control show-tick" ng-model="selectparams.quarter" ng-change="search()"
                                                        ng-options="type.dickey as type.dicvalue for type in quarterList"
                                                        class="form-control"
                                                        name="quarter">
                                                    <option value="" selected>--全部--</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="search-btn" style="margin-right: 20px;">
                            <div style="min-width: 13em">
                                <button class="btn btn-default1"
                                        ng-click="search()">查询
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="search-btn" style="margin-right: 20px;">
                        <div style="float: right">
                            <button role-permission-code="assetList.btnExport" class="btn btn-default1"
                                    ng-click="export()">导出
                            </button>
                        </div>
                    </div>
                </div>
                <div class="body">
                    <div class="zero-list-table-panel">
                        <div class="zero-source-table-div">
                            <table class="table table-bordered table-striped table-hover js-basic-example dataTable text-nowrap">
                                <thead>
                                <tr>
                                    <th>序号</th>
                                    <th>单位</th>
                                    <th>时间</th>
                                    <th>学习内容</th>
                                    <th>学习形式</th>
                                    <th>中心组成员参学人数</th>
                                    <th>重点发言人数</th>
                                    <th>学时</th>
                                    <th>出勤率</th>
                                    <th>补学率</th>
                                    <th>备注</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr ng-repeat="it in dataList">
                                    <td scope="row" class="text-center">
                                        {{selectparams.pagesize*(selectparams.pageindex-1)+$index+1}}
                                    </td>
                                    <td>{{it.DZZMC}}</td>
                                    <td>{{it.STUDY_START_TIME | date:'yyyy-MM-dd'}}</td>
                                    <td>{{it.CASE_NAME}}</td>
                                    <td>{{it.studyModalityName}}</td>
                                    <td>{{it.USERCOUNT}}</td>
                                    <td>{{it.SPEAKCOUNT}}</td>
                                    <td></td>
                                    <td>{{it.RATE}}%</td>
                                    <td></td>
                                    <td></td>
                                </tr>
                                <tr ng-if="dataList.length<=0">
                                    <td colspan="15" style="text-align:center">暂无数据</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <pagination data-pageindex="selectparams.pageindex" data-pagesize="selectparams.pagesize"
                                data-ptotal="pageInfo.ptotal"></pagination>
                </div>
            </div>
        </div>
    </div>
</div>
