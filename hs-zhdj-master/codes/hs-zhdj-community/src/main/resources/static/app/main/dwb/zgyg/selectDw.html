<div class="modal" tabindex="-1" role="dialog">
    <div class="modal-dialog" style="width: 900px;">
        <div class="card">
            <div class="header">
                <button type="button" class="close" ng-click="quxiaoguanbi()">&times;</button>
                <h4 class="modal-title">{{params.title}}</h4>
            </div>
            <div activate-input class="body">
                <div class="table-responsive list-table-panel" style="font-size: 16px">
                    <div class="list-table-title">
                        <div class="table-title" >
                            接收单位（共105个）
                        </div>
                    </div>
                    <div class="outoflow" style="height: 350px;">
                        <table class="table table-bordered table-striped table-hover js-basic-example dataTable text-nowrap" style="position:relative">
                            <thead>
                            <tr>
                                <th></th>
                                <th>党委名称</th>
                                <th>负责人</th>
                                <th>所在党支部</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr ng-repeat="it in receivePcommList">
                                <th><input type="checkbox" id="{{it.dzzdm}}" class="filled-in chk-col-cyan"  ng-model="it.cheked" ng-change="checkitem(it)"><label for="{{it.dzzdm}}"></label></th>
                                <th>{{it.dwName}}</th>
                                <th>{{it.leaderName}}</th>
                                <th>{{it.leaderDzbName}}</th>
                            </tr>
                            <tr ng-if="userList.length<=0">
                                <td colspan="3" style="text-align:center">暂无数据</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="form_foot">
                    <button type="button" class="btn btn-default" ng-click="cancelSelect()">取消</button>
                    <button type="submit" class="btn btn-primary" ng-click="confirmSelect()">选择</button>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
