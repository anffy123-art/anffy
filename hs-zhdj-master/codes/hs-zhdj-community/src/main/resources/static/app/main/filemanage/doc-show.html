<div class="modal" tabindex="-1" role="dialog" style="position: fixed;left: 0;top: 0;height: 100%">
    <div class="modal-dialog" role="document" style="width:100%;height: 100%;padding: 0;margin: 0">
        <div class="card" style="height: 100%">
            <div class="header">
                <button type="button" class="red-close" ng-click="$hide()">&times;</button>
                <h3 class="modal-title">{{title}}</h3>
            </div>
            <div class="body" style="height: 100%">
                <iframe class="iframe-doc" style="height:100%;border: 0;width: 100%;" ng-src="{{isrc}}"></iframe>
            </div>
        </div>
    </div>
</div>
