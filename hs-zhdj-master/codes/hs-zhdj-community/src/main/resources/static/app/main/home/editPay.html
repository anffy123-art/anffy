<div class="modal" tabindex="-1" role="dialog">
    <div class="modal-dialog" style="width: 550px;">
        <div class="card">
            <div class="header" dragable-header>
                <button type="button" class="close" ng-click="$hide()">&times;</button>
                <h4 class="modal-title">{{payTitle}}</h4>
            </div>
            <div activate-input activate-select class="body">
                <form class="form-horizontal" role="form" id="editForm"
                      name="editForm" ng-submit="wxPay(editForm.$valid)" novalidate>
                    <div class="dj-formtable">
                        <table class="dj-table">
                            <tr>
                                <th>缴费金额<span style="color: red">*</span></th>
                                <td ng-class="{ 'has-error' : this.editForm.amount.$invalid &&  this.editForm.$submitted}">
                                    <div style="display: flex;padding: 5px 0 3px 0;">
                                        <input type="number" step="0.01" class="form-control" name="amount"
                                               ng-model="editPayParams.amount" min="{{minAmount}}" ng-required="true" style="width: 100px;"/> <span style="padding-left: 5px;">元</span>
                                    </div>
                                    <span ng-show="this.editForm.amount.$invalid &&  this.editForm.$submitted"
                                          class="error">金额不能小于{{minAmount}}元!</span>
                                </td>
                            </tr>
                        </table>
                    </div>
                    <div class="form_foot">
                        <button type="button" class="btn btn-default" ng-click="$hide()">取消</button>
                        <button type="submit" class="btn btn-primary" form="editForm">确认缴费</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
