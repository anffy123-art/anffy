<div class="dj-formtable">
    <div class="table-responsive list-table-panel">
        <div class="list-table-title">
            <div class="table-title">

            </div>
            <div class="table-tool">
                <ul class="header-dropdown">
                    <li class="dropdown demo-icon-container main-card-more table-more">
                        <a ng-click="showMore_djkp()"
                           class="dropdown-toggle demo-google-material-icon">
                            <span class="icon-name">更多</span>
                            <i class="material-icons">keyboard_arrow_right</i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <table class="table table-bordered table-striped table-hover js-basic-example dataTable text-nowrap">
            <thead>
            <tr>
                <th>序号</th>
                <th>年度</th>
                <th>第一季度评分</th>
                <th>第二季度评分</th>
                <th>第三季度评分</th>
                <th>第四季度评分</th>
                <th>评定等级</th>
            </tr>
            </thead>
            <tbody>
            <tr ng-repeat="it in djkpList">
                <td scope="row" class="text-center">
                    {{$index+1}}
                </td>
                <td class="text-center">{{it.YEAR}}</td>
                <td class="text-center">{{it.QUARTER1}}</td>
                <td class="text-center">{{it.QUARTER2}}</td>
                <td class="text-center">{{it.QUARTER3}}</td>
                <td class="text-center">{{it.QUARTER4}}</td>
                <td class="text-center">{{it.JUDGELEVELNAME}}</td>
            </tr>
            <tr ng-if="djkpList.length==0">
                <td colspan="4" style="text-align:center">暂无数据</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
