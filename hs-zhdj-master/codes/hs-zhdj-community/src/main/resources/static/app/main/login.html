<div class="pageMain" style="width: 100%; height: 100%">
    <div class="common_top">
        <div class="area common_top_title">
            <div class="common_top_logo">
<!--
                <img src="images/sys-logo.png" width="45" height="45">
-->
                <span>{{sysName}}</span>
            </div>
        </div>
    </div>

    <div class="top_view">
        <div class="common_container">
            <img src="../../content/login/ly_banner.jpg" height="100%" width="100%">
        </div>
        <div class="nav_box">
            <div class="nav_box_left">
                <div class="oath_content">
                    <div class="oath_title"></div>
                    <div class="oath_line"></div>
                    <div class="oath_detail">
                        <p class="pl">自信自强、守正创新<span class="fh">，</span></p>
                        <p class="pl">踔厉奋发、勇毅前行</p>
                    </div>
                </div>
            </div>
            <div class="nav_box_right">
                <div class="common_login">
                    <form>
                        <div class="common_login_content">
                            <div class="common_login_title">
                                用户登录
                            </div>
                            <div class="common_login_input">
                                <div class="common_login_user">
                                    <span><img src="../../content/login/login_user_ico.png"></span>
                                    <input type="text" ng-model="loginuser.uid" class="text" placeholder="请输入用户名"
                                           aria-describedby="basic-addon1">
                                </div>
                                <div class="common_login_user">
                                    <span><img src="../../content/login/login_password_ico.png"></span>
                                    <input type="password" ng-model="loginuser.pwd" placeholder="请输入密码"
                                           aria-describedby="basic-addon1">
                                </div>
                            </div>

                            <div class="common_login_submit">
                                <button type="submit" ng-click="login()">
                                    立即登录
                                </button>
                            </div>
                            <div class="form-group common_login_error">
                                <label class="error">{{errorMsg}}</label>
                            </div>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="common_copy">
        <div class="area">
            <div class="common_copy_text">
                建议在分辨率于1366*768或以上访问效果更佳，推荐使用
                谷歌浏览器访问<br>© 2023 {{sysName}}
                版权所有
                <br>
                技术支持：信息中心
                <br>
                <!--<a href="../public/index.html">返回党建</a>-->
            </div>
            <div class="common_copy_ewm">
                <!--<span>客户端下载<br>(点击变大)</span>-->
                <!--<a title="二维码" href="" data-toggle="modal" data-target="#maModal"> <img src="../public/images/ma.png"-->
                                                                                        <!--alt=""/></a>-->
            </div>
        </div>
    </div>

</div>

<!-- 模态框 显示二维码 -->
<div class="modal fade" tabindex="-1" role="dialog" id="maModal"
     style="z-index: 99999;" aria-hidden="true">
    <div class="modal-dialog" style="width: 400px;height: 400px">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"
                        aria-hidden="true">×
                </button>
                <h4 class="modal-title">
                    二维码展示
                </h4>
            </div>
            <div class="modal-body" style="height: 350px">
                <img width="100%" height="100%" src="../public/images/ma.png"/>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default"
                        data-dismiss="modal">关闭
                </button>
            </div>
        </div><!-- /.modal-content -->
    </div><!-- /.modal-dialog -->
</div><!-- /.modal -->
