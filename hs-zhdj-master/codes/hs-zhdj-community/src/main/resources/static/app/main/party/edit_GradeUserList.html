<div activate-input activate-select class="header search-header"
     style="padding-left: 0px !important;padding-right: 0px;!important;">
    <div class="search-param-panel">
        <div class="search-input">
            <form class="form-horizontal">
                <div class="row clearfix form-inline">
                    <div class="col-lg-3 col-md-3 dj-label">
                        <label>姓名</label>
                    </div>
                    <div class="col-lg-3 col-md-3">
                        <div class="form-group">
                            <div class="form-line">
                                <input name="xm" class="form-control" type="text"
                                       ng-model="selectUserParams.xm"
                                       placeholder=""/>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 dj-label">
                        <label>党内职务</label>
                    </div>
                    <div class="col-lg-3 col-md-3">
                        <div class="form-group">
                            <div class="form-line">
                                <select class="form-control show-tick" ng-model="selectUserParams.zwmc"
                                        ng-options="type.bm as type.hzmc for type in zwmcList"
                                        class="form-control"
                                        name="zwmc">
                                    <option value="" selected>--全部--</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row clearfix form-inline">
                    <div class="col-lg-3 col-md-3 dj-label">
                        <label>任职方式</label>
                    </div>
                    <div class="col-lg-3 col-md-3">
                        <div class="form-group">
                            <div class="form-line">
                                <select class="form-control show-tick" ng-model="selectUserParams.rzfs"
                                        ng-options="type.bm as type.hzmc for type in rzfsList"
                                        class="form-control"
                                        name="rzfs">
                                    <option value="" selected>--全部--</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="search-btn" style="margin-right: 20px;">
            <div>
                <button class="btn btn-default1"
                        ng-click="searchGradeUser()">查询
                </button>
            </div>
        </div>
    </div>
    <div class="search-btn" style="margin-right: 20px;">
        <div style="float: right">
            <button class="btn btn-default1"
                    ng-click="addGradeUser()">新增
            </button>
        </div>
    </div>
</div>
<div class="body">
    <div class="table-responsive list-table-panel">
        <table class="table table-bordered table-striped table-hover js-basic-example dataTable text-nowrap">
            <thead>
            <tr>
                <th>序号</th>
                <th>姓名</th>
                <th>党组织名称</th>
                <th>专兼职情况</th>
                <th>党内职务</th>
                <th>届次</th>
                <th>换届时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr ng-repeat="it in gradeUserList">
                <td scope="row" class="text-center">
                    {{selectUserParams.pagesize*(selectUserParams.pageindex-1)+$index+1}}
                </td>
                <td>{{it.XM}}</td>
                <td>{{it.DZZMC}}</td>
                <td class="text-center">{{it.ZZJZQKMC}}</td>
                <td class="text-center">{{it.ZWMCMC}}</td>
                <td class="text-center">{{(it.ZZLB=='100' || it.ZZLB=='200')? it.JC:''}}</td>
                <td class="text-center">{{it.LDJTDXRQ}}</td>
                <td class="text-center">
                    <button
                            class="btn td-btn bg-light-green waves-effect"
                            ng-click="detailGradeUser(it.BZCYXXBS)"
                            title="查看">
                        查看
                    </button>
                    <button
                            class="btn td-btn bg-light-green waves-effect"
                            ng-click="editGradeUser(it.BZCYXXBS)"
                            title="修改">
                        修改
                    </button>
                    <button
                            class="btn td-btn bg-pink waves-effect"
                            ng-click="deleteGradeUser(it.BZCYXXBS)" title="删除">
                        删除
                    </button>
                </td>
            </tr>
            <tr ng-if="gradeUserList.length<=0">
                <td colspan="8" style="text-align:center">暂无数据</td>
            </tr>
            </tbody>
        </table>
    </div>
    <pagination data-pageindex="selectUserParams.pageindex" data-pagesize="selectUserParams.pagesize"
                data-ptotal="pageInfo.ptotal"></pagination>
</div>
