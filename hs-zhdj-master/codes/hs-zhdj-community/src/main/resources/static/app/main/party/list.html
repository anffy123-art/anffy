<titlemenu></titlemenu>
<div class="dj-list">
    <div class="dj-list-body">
        <div party-tree data-selectdzzdm="selectparams.selectdzzdm" data-selectdzzmc="selectparams.selectdzzmc"
             data-isshowxz="1" data-parentcode="selectparams.parentcode"
             data-parentname="selectparams.parentname"
             data-dzzdm="selectparams.szdzzdm"
             data-dzzmc="selectparams.szdzzmc"
             data-userid="selectparams.userid"
             data-showtogglebtn="true"
             data-zzfbtype="selectparams.zzfbType"
             data-defaultselected="selectparams.defaultselected"
             data-isunfold="selectparams.isunfold"
             data-partygroupid="selectparams.partyGroupId"
        ></div>
        <div class="dj-list-content">
            <div class="card">
                <div activate-input activate-select class="header search-header">
                    <div fold-partytree data-isunfold="selectparams.isunfold"></div>
                    <div class="search-param-panel">
                        <div class="search-input">
                            <form class="form-horizontal" name="myform" id="myform">
                                <div class="row clearfix form-inline">
                                    <div class="col-lg-2 col-md-2 dj-label">
                                        <label>当前选中组织</label>
                                    </div>
                                    <div class="col-lg-2 col-md-2">
                                        <div class="form-group">
                                            <div class="form-line">
                                                <div class="input-group input-group-search">
                                                    <input name="selectdzzmc" type="text" style="min-width: 90px"
                                                           ng-model="selectparams.selectdzzmc" class="form-control"
                                                           ng-disabled="true"/>
                                                    <span class="input-group-addon"
                                                          ng-click="setisunfold()">选择</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-2 col-md-2 dj-label">
                                        <label>党组织名称</label>
                                    </div>
                                    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2">
                                        <div class="form-group">
                                            <div class="form-line">
                                                <input name="dzzmc" class="form-control" type="text"
                                                       ng-model="selectparams.dzzmc"
                                                       placeholder="" ng-keypress="($event.which === 13)?search():0"/>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-2 col-md-2 dj-label">
                                        <label>组织类别</label>
                                    </div>
                                    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2">
                                        <div class="form-group">
                                            <div class="form-line">
                                                <select class="form-control show-tick" ng-model="selectparams.zzlbList"
                                                        ng-options="type.bm as type.hzmc for type in zzlbdmList"
                                                        class="form-control"
                                                        name="zzlbList" ng-change="search()">
                                                        <!--multiple="multiple"-->

                                                    <option value="">--全部--</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row clearfix form-inline" ng-show="isShow">
                                    <div class="col-lg-2 col-md-2 dj-label">
                                        <label>基层分类</label>
                                    </div>
                                    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2">
                                        <div class="form-group">
                                            <div class="form-line">
                                                <select class="form-control show-tick" ng-change="search()"
                                                        ng-model="selectparams.jczzfl"
                                                        ng-options="type.bm as type.hzmc for type in jczzflList"
                                                        class="form-control"
                                                        name="jczzfl">
                                                    <option value="">--全部--</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-2 col-md-2 dj-label">
                                        <label>建立党组织日期</label>
                                    </div>
                                    <div class="col-lg-2 col-md-2">
                                        <div class="form-group">
                                            <div class="form-line">
                                                <input name="jldzzrq_begin" class="form-control" ng-change="search()"
                                                       autocomplete="off"
                                                       autoclose="true"
                                                       data-date-format="yyyyMMdd" data-date-type="date"
                                                       ng-model="selectparams.jldzzrq_begin"
                                                       placeholder="" bs-datepicker/>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-2 col-md-2 dj-label">
                                        <label>至</label>
                                    </div>
                                    <div class="col-lg-2 col-md-2">
                                        <div class="form-group">
                                            <div class="form-line">
                                                <input name="jldzzrq_end" class="form-control" type="text"
                                                       ng-change="search()"
                                                       autocomplete="off"
                                                       autoclose="true"
                                                       data-date-format="yyyyMMdd" data-date-type="date"
                                                       ng-model="selectparams.jldzzrq_end"
                                                       placeholder="" bs-datepicker/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                        <div class="search-btn" style="margin-right: 20px;">
                            <div style="min-width: 13em">
                                <span class="moreSpan" ng-click="isShowClick()"
                                      style='padding-right:1em;cursor:pointer;'>{{moreTxt}}<i class="material-icons"
                                                                                              style="position: relative;top:7px;">{{isShow ? 'expand_less' : 'expand_more'}}</i></span>
                                <button  class="btn btn-default1"
                                        ng-click="search()">查询
                                </button>
                                <button  class="btn btn-default1 btn-reset"
                                        ng-click="reset()">重置
                                </button>
                                <!--<button role-permission-code="partyList.btnExport" class="btn  btn-default1"-->
                                <!--ng-click="export()">导出-->
                                <!--</button>-->
                                <!--<button class="btn btn-default1" role-permission-code="partyList.btnAdd"-->
                                <!--ng-click="addParty()">新增-->
                                <!--</button>-->
                            </div>
                        </div>
                    </div>
                    <div class="search-btn" style="margin-right: 20px;">
                        <!--<div selected-partyname data-selectdzzmc="selectparams.selectdzzmc"></div>-->
                        <div style="float: right">
                            <!--<button role-permission-code="partyList.btnSearch" class="btn btn-default1"-->
                            <!--ng-click="search()">查询-->
                            <!--</button>-->
                            <button class="btn  btn-default1"
                                    ng-click="export()">导出
                            </button>
                            <button class="btn btn-default1"
                                    ng-click="addParty()">新增
                            </button>
                        </div>
                    </div>
                </div>
                <div class="body">
                    <div class="table-responsive list-table-panel">
                        <table class="table table-bordered table-striped table-hover js-basic-example dataTable text-nowrap">
                            <thead>
                            <tr>
                                <th>序号</th>
                                <th>党组织名称</th>
                                <th>党组织编码</th>
                                <th>组织类别</th>
                                <th>基层分类</th>
                                <th>党员数</th>

                                <th>建立党组织日期</th>
                                <th>上次换届时间</th>
                                <th>操作</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr ng-repeat="it in dataList">
                                <td scope="row" class="text-center">
                                    {{selectparams.pagesize*(selectparams.pageindex-1)+$index+1}}
                                </td>
                                <td style="min-width:300px;white-space:pre-line;">{{it.DZZMC}}</td>
                                <td>{{it.DZZDM}}</td>
                                <td class="text-center">{{it.ZZLBMC}}</td>
                                <td class="text-center">{{it.JCZZFLMC}}</td>
                                <td class="text-center">{{it.USERCOUNT}}</td>

                                <td class="text-center">{{it.JLDZZRQ}}</td>
                                <td class="text-center">{{it.SCHJSJ}}</td>
                                <td class="text-center">
                                    <button class="btn td-btn bg-light-green waves-effect"
                                            ng-click="detailParty(it.ZZQKXXBS,it.ZZLBMC,it.DZZDM)"

                                            title="查看">
                                        查看
                                    </button>
                                    <button ng-if="it.DZZDM!='001091209017'"
                                            class="btn td-btn bg-light-green waves-effect"
                                            ng-click="editParty(it.ZZQKXXBS)"
                                            title="修改">
                                        修改
                                    </button>
                                    <button ng-if="it.DZZDM!='001091209017'"
                                            class="btn td-btn bg-pink waves-effect"
                                            ng-click="delete(it.ZZQKXXBS)" title="删除">
                                        删除
                                    </button>
                                </td>
                            </tr>
                            <tr ng-if="pageInfo.ptotal==0">
                                <td colspan="9" style="text-align:center">暂无数据</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <pagination data-pageindex="selectparams.pageindex" data-pagesize="selectparams.pagesize"
                                data-ptotal="pageInfo.ptotal"></pagination>
                </div>
            </div>
        </div>
    </div>
</div>
