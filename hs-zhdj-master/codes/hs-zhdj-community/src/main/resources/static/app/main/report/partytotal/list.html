<titlemenu></titlemenu>
<div class="dj-list">
    <div class="dj-list-body">
        <div party-tree data-selectdzzdm="treeparams.selectdzzdm" data-selectdzzmc="treeparams.selectdzzmc"
             data-defaultselected="treeparams.defaultselected" data-isunfold="treeparams.isunfold" data-showdxz="treeparams.showdxz"></div>
        <div class="dj-list-content">
            <div class="card">
                <div activate-input activate-select class="header search-header">
                    <div fold-partytree data-isunfold="treeparams.isunfold"></div>
                    <div class="search-param-panel">
                        <div class="search-input">
                            <form class="form-horizontal">
                                <div class="row clearfix form-inline">
                                    <div class="col-lg-2 col-md-2 dj-label">
                                        <label>当前选中组织</label>
                                    </div>
                                    <div class="col-lg-2 col-md-2">
                                        <div class="form-group">
                                            <div class="form-line">
                                                <div class="input-group input-group-search">
                                                    <input name="selectdzzmc" type="text" style="min-width: 90px"
                                                           ng-model="treeparams.selectdzzmc" class="form-control"
                                                           ng-disabled="true"/>
                                                    <span class="input-group-addon"
                                                          ng-click="setisunfold()">选择</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-2 col-md-2 dj-label">
                                        <label>年度</label>
                                    </div>
                                    <div class="col-lg-2 col-md-2">
                                        <div class="form-group">
                                            <div class="form-line">
                                                <select class="form-control show-tick" ng-model="selectparams.year"
                                                        ng-change="search()"
                                                        ng-options="type.dickey as type.dicvalue for type in yearList"
                                                        class="form-control"
                                                        name="year">
                                                    <option value="" selected>--全部--</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="search-btn" style="margin-right: 20px;">
                            <div style="min-width: 13em">
                                <button class="btn btn-default1"
                                        ng-click="search()">查询
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="body">
                    <div class="zero-list-table-panel">
                        <div class="zero-target-table-div">
                            <table class="table table-bordered table-striped table-hover js-basic-example dataTable text-nowrap">
                                <thead>
                                    <th >序号</th>
                                    <th>组织名称</th>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="it in dataList">
                                        <td scope="row" class="text-center">
                                            {{selectparams.pagesize*(selectparams.pageindex-1)+$index+1}}
                                        </td>
                                        <td>{{it.DZZMC}}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="zero-source-table-div">
                            <table class="table table-bordered table-striped table-hover js-basic-example dataTable text-nowrap">
                                <thead>
                                <tr>
                                    <th >党委数</th>
                                    <th >党总支数</th>
                                    <th >党支部数</th>
                                    <th >党小组数</th>
                                    <th >年度应换届党支部数</th>
                                    <th >党员数</th>
                                    <!--<th rowspan="2">在岗<br>党员数</th>-->
                                    <!--<th rowspan="2">党员占<br>职工比例</th>-->
                                    <!--<th rowspan="2">党员先<br>锋岗数</th>-->
                                    <!--<th rowspan="2">红旗责<br>任区数</th>-->
                                    <!--<th colspan="3" style="height: 60px;">党内品牌数</th>-->
                                    <!--<th rowspan="2">党内活<br>动室数</th>-->
                                    <!--<th rowspan="2">宣传<br>阵地数</th>-->
                                    <!--<th rowspan="2">互联网<br>工作群数</th>-->
                                </tr>
                                <!--<tr>-->
                                    <!--<th style="height: 34px;">国家级</th>-->
                                    <!--<th>省级</th>-->
                                    <!--<th>学院级</th>-->
                                <!--</tr>-->
                                </thead>
                                <tbody>
                                <tr ng-repeat="it in dataList">
                                    <td class="text-center"><a ng-click="showParty(it.DZZDM,'100,200')">{{it.NUM_DW}}</a></td>
                                    <td class="text-center"><a ng-click="showParty(it.DZZDM,'300')">{{it.NUM_DZZ}}</a></td>
                                    <td class="text-center"><a ng-click="showParty(it.DZZDM,'400')">{{it.NUM_DZB}}</a></td>
                                    <td class="text-center"><a ng-click="showParty(it.DZZDM,'500')">{{it.NUM_DXZ}}</a></td>
                                    <td class="text-center"><a ng-click="showParty(it.DZZDM,'400',1)">{{it.NUM_YHJDZB}}</a></td>
                                    <td class="text-center"><a ng-click="showPartyUser(it.DZZDM)">{{it.USERCOUNT}}</a></td>
                                    <!--<td class="text-center"><a ng-click="showPartyUser(it.DZZDM,1)">{{it.NUM_ZGUSER}}</a></td>-->
                                    <!--<td class="text-center">{{it.USERRATE}}%</td>-->
                                    <!--<td class="text-center"><a ng-click="showCgjq(it.DZZDM,1)">{{it.NUM_XFG}}</a></td>-->
                                    <!--<td class="text-center"><a ng-click="showCgjq(it.DZZDM,2)">{{it.NUM_ZRQ}}</a></td>-->
                                    <!--<td class="text-center"><a ng-click="showDnpp(it.DZZDM,3)">{{it.NUM_GT}}</a></td>-->
                                    <!--<td class="text-center"><a ng-click="showDnpp(it.DZZDM,2)">{{it.NUM_JT}}</a></td>-->
                                    <!--<td class="text-center"><a ng-click="showDnpp(it.DZZDM,1)">{{it.NUM_ZD}}</a></td>-->
                                    <!--<td class="text-center"><a ng-click="showActivityRoom(it.DZZDM)">{{it.NUM_ROOM}}</a></td>-->
                                    <!--<td class="text-center"><a ng-click="showPosition(it.DZZDM)">{{it.NUM_POSITION}}</a></td>-->
                                    <!--<td class="text-center"><a ng-click="showWxgroup(it.DZZDM)">{{it.NUM_WX}}</a></td>-->
                                </tr>
                                <tr ng-if="pageInfo.ptotal==0">
                                    <td colspan="16" style="text-align:center">暂无数据</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <pagination data-pageindex="selectparams.pageindex" data-pagesize="selectparams.pagesize"
                                data-ptotal="pageInfo.ptotal"></pagination>
                </div>
            </div>
        </div>
    </div>
</div>
