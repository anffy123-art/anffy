<titlemenu></titlemenu>
<div class="dj-card">
    <div class="dj-body" activate-input activate-select>
        <form class="form-horizontal" role="form" name="editForm" novalidate>
            <div ng-include="'../main/shyk/meetingmodel.html'"></div>
            <div panel-title data-title="'审核会议决议'"></div>
            <div ng-repeat="it in decisionList">
                <div class="card" style="box-shadow: none;border: 1px solid rgba(204, 204, 204, 0.35);">
                    <div class="header" style="display:flex;justify-content: space-between;">
                        <h2>
                            会议决议 {{$index+1}}
                        </h2>
                    </div>
                    <div class="body">
                        <span ng-bind-html="it.content|showhtmlfilter"></span>
                    </div>
                </div>
            </div>
            <div class="dj-formtable">
                <table class="dj-table dj-table2">
                    <tr>
                        <th>审核内容</th>
                        <td colspan="3">
                            <textarea class="form-control" ng-model="dataModel.decisionapprovecontent" rows="5"></textarea>
                        </td>
                    </tr>
                </table>
            </div>
            <div class="form_foot">
                <button type="button" class="btn btn-default" ng-click="pagechange();">返回</button>
                <button class="btn btn-primary"
                        ng-click="saveData()">提交
                </button>
            </div>
        </form>
    </div>
</div>
