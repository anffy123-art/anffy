<div class="modal" tabindex="-1" role="dialog">
    <div class="modal-dialog" style="width: 850px;">
        <div class="card">
            <div class="header" dragable-header>
                <button type="button" class="close" ng-click="$hide()">&times;</button>
                <h4 class="modal-title">三会一课达标情况（{{partyName}}）</h4>
            </div>
            <div activate-input activate-select class="body">
                <div class="table-responsive list-table-panel">
                    <table class="table table-bordered table-striped table-hover js-basic-example dataTable text-nowrap">
                        <thead>
                        <tr>
                            <th>季度</th>
                            <th>类别</th>
                            <th>指标</th>
                            <th>第1月</th>
                            <th>第2月</th>
                            <th>第3月</th>
                            <th>季度总数</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr ng-repeat="it in totalList">
                            <td class="text-center" rowspan="4" ng-if="$index==0 || ($index>=4 && $index%4==0)"
                                style="background-color: #fff;">
                                {{it.YY}}年第{{it.QUARTER}}季度
                            </td>
                            <td class="text-center">{{it.SHYKTYPENAME}}</td>
                            <td class="text-center">{{it.PLANTYPENAME}}</td>
                            <td class="text-center" ng-class="it.firstWarn=='1'?'warnbox':''">
                                {{it.MONTH_FIRST}}
                                <div class="red_line"></div>
                            </td>
                            <td class="text-center" ng-class="it.secondWarn=='1'?'warnbox':''">
                                {{it.MONTH_SECOND}}
                                <div class="red_line"></div>
                            </td>
                            <td class="text-center" ng-class="it.thirdWarn=='1'?'warnbox':''">
                                {{it.MONTH_THIRD}}
                                <div class="red_line"></div>
                            </td>
                            <td class="text-center" ng-class="it.totalWarn=='1'?'warnbox':''">
                                {{it.TOTAL}}
                                <div class="red_line"></div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="form_foot">
                    <button type="button" class="btn btn-default" ng-click="$hide()">关闭</button>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
    .col_red {
        box-shadow: inset 0 0 1px #951f1f, inset 0 0 20px rgba(251, 0, 0, 0.5);
    }

    .warnbox {
        position: relative;
        overflow: hidden;
    }

    .warnbox .box-con {
        width: 70px;
        height: 70px;
        position: absolute;
        background: #AB1818;
        left: -50px;
        transform: rotate(30deg);
    }

    .warnbox .box-con2 {
        width: 72px;
        height: 72px;
        position: absolute;
        background: white;
        left: -70px;
        transform: rotate(30deg);
    }

    .warnbox .red_line {
        margin: 0 auto;
        height: 5px;
        background: #AB1818;
        width: 15px;
    }

</style>
