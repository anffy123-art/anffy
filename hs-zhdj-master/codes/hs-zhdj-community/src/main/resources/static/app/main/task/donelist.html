<div class="panel-default theme-panel">
    <titlemenu></titlemenu>
    <div class="graph-form">
        <form class="search-param-panel">
            <div class="form-inline">
                <div class="form-group">
                    <label>日期：</label>
                    <input class="form-control" type="text" name="datebegin" data-date-type="string"
                           data-date-format="yyyy-MM-dd" ng-model="finddata.dateb" bs-datepicker/>
                </div>
                <div class="form-group">
                    <label>到：</label>
                    <input class="form-control" ng-model="finddata.datee" data-date-type="string"
                           data-date-format="yyyy-MM-dd" type="text" name="dateend" bs-datepicker/>
                </div>
                <div class="form-group">
                    <button class="btn btn-default1" type="submit" ng-click="selectpage()">查询</button>
                </div>
            </div>
        </form>

        <div class="list-table-panel">
            <table class="table table-bordered">
                <thead>
                <tr>
                    <th class="col-md-2">流程步骤</th>
                    <th class="col-md-5">已办标题</th>
                    <th class="col-md-2">发起人</th>
                    <th class="col-md-3">处理时间</th>
                </tr>
                </thead>
                <tbody>
                <tr ng-repeat="it in items">
                    <td>{{it.toDoAttrVal}}</td>
                    <td><a ng-href="#!/{{it.toDoUrl}}">{{it.toDoTitle}}</a></td>
                    <td>{{it.userName}}</td>
                    <td>{{it.createTimeString}}</td>
                </tr>
                <tr ng-if="items.length<=0">
                    <td colspan="7" style="text-align:center">暂无数据</td>
                </tr>
                </tbody>
            </table>
            <!--分页directive-->
            <!--参数含义：data-pageindex：当前页面，data-pagesize：每页显示多少数据，data-ptotal:数据总长度-->
            <pagination data-pageindex="finddata.pageindex" data-pagesize="finddata.pagesize"
                        data-ptotal="finddata.total"></pagination>
        </div>
    </div>
</div>
