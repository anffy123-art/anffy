<table class="table table-bordered tform" ng-controller="developmentTaskCtrl">
    <tr>
        <th class="col-md-2">任务类型:</th>
        <td class="col-md-4">
            {{taskType}}
        </td>

        <th class="col-md-2">负责人:</th>
        <td class="col-md-4">{{taskName}}</td>
    </tr>
    <tr>
        <th>描述:</th>
        <td colspan="3">{{task.TaskNote}}</td>
    </tr>
    <tr>
        <th>完成时限:</th>
        <td>{{task.TaskLimitTime}}</td>
        <th>创建时间：</th>
        <td>{{task.LastDoneTime}}</td>
    </tr>
    <tr>
        <th>预计工作量:</th>
        <td>{{task.ExpectQuantity}}</td>
        <th>实际工作量：</th>
        <td ng-class="{ 'has-error' : isShow}">
            <label>
                <input type="number" step="0.01" min="0" name="RealQuantity" ng-change="change()"
                       ng-readonly="flowdata.readonly" class="form-control" ng-model="task.RealQuantity" required/>
            </label>
            <span colspan="3" style="color:brown" ng-show="isShow" class="help-block">
                请填写实际工作量
            </span>
        </td>
    </tr>
</table>
